<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobileWorld Station - Contact Us</title>

<style>

/* GENERAL */
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
}

/* NAVBAR */
header {
  background: black;
  color: white;
  padding: 15px 40px;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav h2 {
  margin: 0;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 15px;
  padding: 0;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  padding: 8px 14px;
  border-radius: 6px;
  transition: 0.3s;
}

nav a:hover {
  background: white;
  color: black;
}

/* PAGE TITLE */
.page-title {
  background: #111;
  color: white;
  text-align: center;
  padding: 70px 20px;
}

.page-title h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

/* CONTACT SECTION */
.contact-section {
  padding: 50px;
  max-width: 700px;
  margin: 40px auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.contact-section h2 {
  text-align: center;
  margin-bottom: 30px;
}

/* FORM */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: black;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #333;
}

/* EXTRA CONTACT INFO */
.contact-info {
  text-align: center;
  margin-top: 20px;
  color: #555;
}

/* FOOTER */
footer {
  background: black;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 40px;
}

</style>
</head>

<body>

<header>
  <nav>
    <h2>MobileWorld Station</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="accessories.html">Accessories</a></li>
      <li><a href="new-releases.html">New Releases</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="plans.html">Plans</a></li>
      <li><a href="contact-us.html">Contact</a></li>
      <li><a href="help.html">Help</a></li>
      <li><a href="reviews.html">Reviews</a></li>
    </ul>
  </nav>
</header>

<!-- TITLE -->
<section class="page-title">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you!</p>
</section>

<!-- CONTACT FORM -->
<section class="contact-section">

  <h2>Send a Message</h2>

  <form action="#" method="post">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <input type="text" name="subject" placeholder="Subject" required>
    <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>

  <div class="contact-info">
    <p>Email: support@mobileworldstation.com</p>
    <p>Response time: within 67 hours</p>
  </div>

</section>

<footer>
  <p>© 2026 MobileWorld Station. All Rights Reserved.</p>
</footer>

</body>
</html>
